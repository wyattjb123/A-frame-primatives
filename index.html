<!DOCTYPE html>
<html>
    <head> 
        <title>A-Frame Primitives</title> 
        <script src= "https://aframe.io/releases/1.8.0/aframe.min.js"> 

        </script>
        </head>
        <body>
             <a-scene> 
                 <a-box
                 color="magenta"
                 position="-5 5 -8"
                 rotation="0 45 0"
                 width="2"
                 height="2"
                 depth="2">
                </a-box>
                <a-sphere
                color="green"
                position="0 5 -8"
                radius="1.5">
            </a-sphere>
            <a-text
            value="Hello, world!"
            color="black"
            position="3 0 -8"
            width="20">
        </a-text>
        <a-sky
        color="lightskyblue">
        </a-sky>
        <a-plane
        color="purple"
        position="0 0 -8"
        rotation="-60 0 0"
        width="4"
        height="4">
    </a-plane>
    <a-box
    material= "src: https://upload.wikimedia.org/wikipedia/com- mons/9/92/A-Frame_logo.png?20180929131747; 
    repeat: 3 2" 
    position="0 1.6 -2" 
    rotation="45 45 0">
</a-box>
                </a-scene>
            </body>
            </html>
